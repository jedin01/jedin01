- title: BankOps
  type: In progress
  tone: sunny
  description: >-
    A process automation platform that turns banking services that usually need a branch visit,
    such as customer onboarding and credit applications, into executable, auditable BPMN workflows.
    Regulatory rules become gateways and compliance checkpoints, so regulation stops being
    documentation and becomes process logic. Designed to production standards.
  tags: [Java, Spring Boot, Camunda 8, BPMN]

