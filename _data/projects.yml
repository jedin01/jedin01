# tone: blue, teal, green ou sunny.
- title: Default BPMN linting in VS Code
  type: Open source contribution
  tone: teal
  featured: true
  description: >-
    I keep BPMN files in Git and edit them in VS Code, so I opened issue #1320 and PR #1321 on
    Miragon's BPMN Modeler. Their team expanded the idea and shipped platform-aware linting
    (Camunda 7 or 8), on by default, in v1.8.0.
  tags: [BPMN as code, VS Code, TypeScript]
  link: https://github.com/Miragon/bpmn-vscode-modeler/pull/1321
  link_label: See the pull request

