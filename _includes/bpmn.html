<!-- Processo BPMN 2.0 (pedido de crédito) com notação do Camunda Modeler.
     Split e merge exclusivos simétricos; um token de instância percorre o caminho de baixo risco, como no Operate. -->
<svg class="bpmn" viewBox="-24 0 734 300" role="img" aria-labelledby="bpmn-title">
  <title id="bpmn-title">BPMN 2.0 diagram of a credit request process: request received, a DMN table scores the risk, low risk requests are approved in core banking and high risk ones go to an analyst, then both paths merge and the customer is notified.</title>
  <defs>
    <marker id="bpmn-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" class="bpmn-arrowhead"/>
    </marker>
  </defs>

  <!-- Fluxos de sequência -->
  <g class="bpmn-flows" marker-end="url(#bpmn-arrow)">
    <path d="M48 150 H80"/>
    <path d="M184 150 H214"/>
    <path d="M239 125 V70 H300"/>
    <path d="M239 175 V230 H300"/>
    <path d="M404 70 H465 V125"/>
    <path d="M404 230 H465 V175"/>
    <path d="M490 150 H520"/>
    <path d="M624 150 H646"/>
  </g>
  <text class="bpmn-label bpmn-label--flow" x="246" y="63" text-anchor="start">Low risk</text>
  <text class="bpmn-label bpmn-label--flow" x="246" y="223" text-anchor="start">High risk</text>

  <!-- Evento de início por mensagem -->
  <circle class="bpmn-shape" cx="30" cy="150" r="18"/>
  <rect class="bpmn-mark" x="20" y="144" width="20" height="13" rx="1"/>
  <path class="bpmn-mark" d="M20 144 L30 151 L40 144"/>
  <text class="bpmn-label" x="30" y="186"><tspan x="30">Credit request</tspan><tspan x="30" dy="13">received</tspan></text>

  <!-- Business rule task (DMN) -->
  <rect class="bpmn-shape bpmn-task" x="80" y="114" width="104" height="72" rx="10"/>
  <rect class="bpmn-mark" x="88" y="121" width="16" height="12" rx="1"/>
  <path class="bpmn-mark" d="M88 125 H104 M93 125 V133"/>
  <text class="bpmn-label" x="132" y="149"><tspan x="132">Score</tspan><tspan x="132" dy="14">credit risk</tspan></text>

  <!-- Gateway exclusivo (split) -->
  <path class="bpmn-shape" d="M239 125 L264 150 L239 175 L214 150 z"/>
  <path class="bpmn-mark bpmn-mark--bold" d="M231 142 L247 158 M247 142 L231 158"/>

  <!-- Service task -->
  <rect class="bpmn-shape bpmn-task" x="300" y="34" width="104" height="72" rx="10"/>
  <circle class="bpmn-mark" cx="315" cy="47" r="4.5"/>
  <path class="bpmn-mark" d="M315 39.5 V41.5 M315 52.5 V54.5 M307.5 47 H309.5 M320.5 47 H322.5 M309.7 41.7 L311.1 43.1 M318.9 50.9 L320.3 52.3 M309.7 52.3 L311.1 50.9 M318.9 43.1 L320.3 41.7"/>
  <text class="bpmn-label" x="352" y="69"><tspan x="352">Approve in</tspan><tspan x="352" dy="14">core banking</tspan></text>

  <!-- User task -->
  <rect class="bpmn-shape bpmn-task" x="300" y="194" width="104" height="72" rx="10"/>
  <circle class="bpmn-mark" cx="315" cy="205" r="4"/>
  <path class="bpmn-mark" d="M308 216 C309 210 321 210 322 216"/>
  <text class="bpmn-label" x="352" y="229"><tspan x="352">Analyst</tspan><tspan x="352" dy="14">review</tspan></text>

  <!-- Gateway exclusivo (merge) -->
  <path class="bpmn-shape" d="M465 125 L490 150 L465 175 L440 150 z"/>
  <path class="bpmn-mark bpmn-mark--bold" d="M457 142 L473 158 M473 142 L457 158"/>

  <!-- Send task -->
  <rect class="bpmn-shape bpmn-task" x="520" y="114" width="104" height="72" rx="10"/>
  <rect class="bpmn-mark-fill" x="527" y="121" width="17" height="12" rx="1"/>
  <path class="bpmn-mark-inv" d="M527 121 L535.5 128 L544 121"/>
  <text class="bpmn-label" x="572" y="149"><tspan x="572">Notify</tspan><tspan x="572" dy="14">customer</tspan></text>

  <!-- Evento de fim -->
  <circle class="bpmn-shape bpmn-end" cx="664" cy="150" r="18"/>
  <text class="bpmn-label" x="664" y="186"><tspan x="664">Customer</tspan><tspan x="664" dy="13">notified</tspan></text>

  <!-- Token da instância: pára em cada tarefa, como uma instância real -->
  <circle class="bpmn-token" r="8" cx="0" cy="0">
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" path="M30 150 H239 V70 H465 V150 H664"
      keyTimes="0;0.1;0.22;0.45;0.57;0.8;0.9;0.97;1" keyPoints="0;0.128;0.128;0.506;0.506;0.884;0.884;1;1"/>
  </circle>
</svg>
